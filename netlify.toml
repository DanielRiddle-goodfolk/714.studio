# Studio 7:14 — Netlify configuration
#
# The 16 interior pages are generated from build/content.py, so they are built
# here rather than committed. That keeps the repo free of 200 KB of near-identical
# HTML and, more usefully, makes a pull request show the change to the copy itself
# instead of the same edit repeated across sixteen files.
#
# index.html is committed — it descends from the original Manus DOM capture, which
# is a local artefact, so it is source rather than output.
#
# The build is a few seconds of Python with no dependencies.

[build]
  publish = "."
  command = "python3 build/content.py && python3 build/inject.py"

[build.environment]
  PYTHON_VERSION = "3.11"

# Pretty URLs: /wellness/pemf/ rather than /wellness/pemf/index.html
[build.processing]
  skip_processing = false

# Deploy previews for every pull request — this is the review mechanism.
[context.deploy-preview]
  publish = "."

[context.production]
  publish = "."

# ---------------------------------------------------------------- headers

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprinted-by-content assets can be cached hard; HTML must not be, or
# visitors keep seeing the previous deploy.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------- redirects

# The old Squarespace paths, so existing links and search results survive the
# cutover. Add to this list as more old URLs surface in Search Console.
[[redirects]]
  from = "/infraredsauna"
  to = "/wellness/far-infrared-sauna/"
  status = 301

[[redirects]]
  from = "/nervous-system-trainer"
  to = "/wellness/nervous-system-trainer/"
  status = 301

[[redirects]]
  from = "/pemf"
  to = "/wellness/pemf/"
  status = 301

[[redirects]]
  from = "/getwell-massage"
  to = "/wellness/get-well-massage/"
  status = 301

[[redirects]]
  from = "/mindthetruth"
  to = "/mind-the-truth/"
  status = 301

[[redirects]]
  from = "/team"
  to = "/about/"
  status = 301
